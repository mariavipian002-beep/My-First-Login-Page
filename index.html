<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login • Nebula</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
    }
    .glass-input {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }
    .glass-input:focus {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(147, 51, 234, 0.6);
      box-shadow: 0 0 20px rgba(147, 51, 234, 0.4);
    }
    video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }
  </style>
</head>
<body class="h-full overflow-hidden text-white">

  <video autoplay loop muted playsinline class="fixed inset-0 w-full h-full object-cover">
    <source src="https://www.dropbox.com/scl/fi/loa5e0ba413ruudn1enp7/58193-487176852_small.mp4?rlkey=mhxq721pq878khfmm7vc46ds8&st=c3ptxvzq&dl=1" type="video/mp4">
  </video>

  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      
      <div class="glass rounded-3xl overflow-hidden border-t border-white/20">
        
        <div class="p-8 text-center bg-gradient-to-b from-white/10 to-transparent backdrop-blur-xl">
          <h1 id="form-title" class="text-4xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-purple-300 to-pink-300">
            Welcome Back
          </h1>
          <p id="form-subtitle" class="text-white/70 text-lg">Log in to continue your journey</p>
        </div>

        <div class="p-8">
          <form id="auth-form" novalidate class="space-y-6">
            
            <div id="name-field" class="relative hidden">
              <i data-lucide="user" class="absolute left-4 top-4 h-5 w-5 text-white/60"></i>
              <input
                type="text"
                name="name"
                placeholder="Full Name"
                class="glass-input w-full pl-12 pr-4 py-4 rounded-xl focus:outline-none text-white placeholder-white/50"
                required
              />
            </div>

            <div class="relative">
              <i data-lucide="mail" class="absolute left-4 top-4 h-5 w-5 text-white/60"></i>
              <input
                type="email"
                name="email"
                placeholder="Email Address"
                class="glass-input w-full pl-12 pr-4 py-4 rounded-xl focus:outline-none text-white placeholder-white/50"
                required
              />
            </div>

            <div class="relative">
              <i data-lucide="lock" class="absolute left-4 top-4 h-5 w-5 text-white/60"></i>
              <input
                type="password"
                name="password"
                placeholder="Password"
                id="password-input"
                class="glass-input w-full pl-12 pr-12 py-4 rounded-xl focus:outline-none text-white placeholder-white/50"
                required
              />
              <i data-lucide="eye-off" id="toggle-password" class="toggle-password absolute right-4 top-4 h-5 w-5 text-white/60 hover:text-white cursor-pointer"></i>
            </div>

            <div id="login-options" class="flex items-center justify-between text-sm">
              <label class="flex items-center cursor-pointer">
                <input type="checkbox" class="w-4 h-4 rounded border-white/30 text-purple-400 focus:ring-purple-500" />
                <span class="ml-2 text-white/80">Remember me</span>
              </label>
              <a href="#" class="text-purple-300 hover:text-purple-200 transition">Forgot password?</a>
            </div>

            <button
              type="submit"
              id="submit-btn"
              class="w-full py-4 mt-4 font-semibold text-white rounded-xl
                     bg-gradient-to-r from-purple-600/80 to-pink-600/80
                     hover:from-purple-500 hover:to-pink-500
                     backdrop-blur-xl border border-white/20
                     shadow-2xl transform hover:scale-[1.02] transition duration-300"
            >
              Sign In
            </button>
          </form>

          <div class="my-8 flex items-center">
            <div class="flex-1 border-t border-white/20"></div>
            <span class="px-4 text-sm text-white/50">or</span>
            <div class="flex-1 border-t border-white/20"></div>
          </div>

          <div class="text-center">
            <p class="text-white/80">
              <span id="toggle-text">Don't have an account?</span>
              <button
                type="button"
                id="toggle-link"
                class="font-bold text-purple-300 hover:text-purple-200 ml-2 transition"
              >
                Sign Up
              </button>
            </p>
          </div>
        </div>
      </div>

      <p class="mt-10 text-center text-white/50 text-sm tracking-wider">
        © 2025 Nebula • Made with <span class="text-pink-400">♥</span> in the Cosmos
      </p>
    </div>
  </div>

<script type="module">
  // Firebase Config (unchanged)
  const firebaseConfig = {
    apiKey: "AIzaSyBZSOoNw1ouEe_7b7hVyez4nn1NI-Qie2U",
    authDomain: "myloginapp-b7055.firebaseapp.com",
    projectId: "myloginapp-b7055",
    storageBucket: "myloginapp-b7055.firebasestorage.app",
    messagingSenderId: "852840846444",
    appId: "1:852840846444:web:9c452bdfc6a89544b77449",
    measurementId: "G-L3M790CXD2"
  };

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  lucide.createIcons();

  const isLogin = { value: true };
  const elements = {
    title: document.getElementById('form-title'),
    subtitle: document.getElementById('form-subtitle'),
    nameField: document.getElementById('name-field'),
    loginOptions: document.getElementById('login-options'),
    submitBtn: document.getElementById('submit-btn'),
    toggleText: document.getElementById('toggle-text'),
    toggleLink: document.getElementById('toggle-link'),
    passwordInput: document.getElementById('password-input'),
    togglePasswordIcon: document.getElementById('toggle-password'),
    form: document.getElementById('auth-form')
  };

  function switchToSignup() {
    isLogin.value = false;
    elements.title.textContent = "Join the Cosmos";
    elements.subtitle.textContent = "Create your account and explore";
    elements.nameField.classList.remove('hidden');
    elements.loginOptions.classList.add('hidden');
    elements.submitBtn.textContent = "Create Account";
    elements.toggleText.textContent = "Already have an account?";
    elements.toggleLink.textContent = "Log In";
    elements.form.reset();
  }

  function switchToLogin() {
    isLogin.value = true;
    elements.title.textContent = "Welcome Back";
    elements.subtitle.textContent = "Log in to continue your journey";
    elements.nameField.classList.add('hidden');
    elements.loginOptions.classList.remove('hidden');
    elements.submitBtn.textContent = "Sign In";
    elements.toggleText.textContent = "Don't have an account?";
    elements.toggleLink.textContent = "Sign Up";
    elements.form.reset();
  }

  elements.toggleLink.addEventListener('click', () => {
    isLogin.value ? switchToSignup() : switchToLogin();
  });

  elements.togglePasswordIcon.addEventListener('click', () => {
    const type = elements.passwordInput.type === 'password' ? 'text' : 'password';
    elements.passwordInput.type = type;
    elements.togglePasswordIcon.setAttribute('data-lucide', type === 'password' ? 'eye-off' : 'eye');
    lucide.createIcons();
  });

  // 👇 FIXED: Redirection added after successful sign-up
  async function handleSignUp(email, password) {
    try {
      elements.submitBtn.textContent = "Creating...";
      await createUserWithEmailAndPassword(auth, email, password);
      alert("Account created successfully! 🌌");
      window.location.href = 'dashboard.html'; 
    } catch (error) {
      elements.submitBtn.textContent = "Create Account";
      alert(getFriendlyErrorMessage(error.code));
    }
  }

  // 👇 FIXED: Redirection added after successful login
  async function handleLogin(email, password) {
    try {
      elements.submitBtn.textContent = "Entering...";
      await signInWithEmailAndPassword(auth, email, password);
      alert("Welcome back! 🚀");
      window.location.href = 'dashboard.html';
    } catch (error) {
      elements.submitBtn.textContent = "Sign In";
      alert(getFriendlyErrorMessage(error.code));
    }
  }

  function getFriendlyErrorMessage(code) {
    const messages = {
      'auth/email-already-in-use': 'This email is already taken.',
      'auth/invalid-email': 'Please enter a valid email.',
      'auth/weak-password': 'Password should be at least 6 characters.',
      'auth/user-not-found': 'No account found with this email.',
      'auth/wrong-password': 'Incorrect password.'
    };
    return messages[code] || 'Something went wrong. Try again.';
  }

  elements.form.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = e.target.email.value.trim();
    const password = e.target.password.value;

    if (!email || !password) return alert("Please fill all fields");

    isLogin.value ? handleLogin(email, password) : handleSignUp(email, password);
  });

  onAuthStateChanged(auth, (user) => {
    if (user) console.log("Active user:", user.email);
  });
</script>
</body>
</html>
